# Deploys on demand: Actions > Deploy > Run workflow. SETUP.md lists the secrets it needs.
name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  # clubedge:if deploy=fly
  fly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 1.6, by commit, and flyctl by version: a moved tag or a new release cannot change what
      # runs with the deploy token.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.5.6
      # Builds on Fly's builders and runs the release command (migrations) before switching.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # clubedge:end
  # clubedge:if deploy=railway
  railway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Uploads this checkout; Railway builds the image and runs the pre-deploy migrations set by
      # .railway/railway.ts (applied with `pnpm clubedge deploy` or `railway config apply`).
      - run: npx --yes @railway/cli@5.71.0 up --ci --service "$RAILWAY_SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
  # clubedge:end
  # clubedge:if deploy=render
  render:
    runs-on: ubuntu-24.04
    steps:
      # The service's deploy hook starts a deploy of its branch, with its pre-deploy migrations.
      - run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
  # clubedge:end
  # clubedge:if deploy=vercel
  vercel:
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Builds here with the project's production settings and variables (including the
      # migrations in its build command), then uploads the result.
      - run: npx --yes vercel@65.9.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.9.0 build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.9.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
  # clubedge:end
  # clubedge:if deploy=netlify
  netlify:
    runs-on: ubuntu-24.04
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds with netlify.toml (including its migrations) and the site's variables, then deploys.
      - run: npx --yes netlify-cli@27.16.2 deploy --build --prod
        working-directory: apps/web
  # clubedge:end
